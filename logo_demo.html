<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpriteFetch Logo Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .logo { display:flex; align-items:center; gap:16px; }
    .icon { width:64px; height:64px; }
    .pixel-svg { width:420px; height:80px; }
    /* Optional: show a subtle container */
    .card { padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.08); background:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <!-- Small pixel folder icon (reused from app) -->
      <svg class="icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 3H6V4H8V5H14V13H2V3Z" fill="#000000"/>
        <path d="M3 4H5V5H7V6H13V12H3V4Z" fill="#FFDE00"/>
        <path d="M1 7H15V14H1V7Z" fill="#000000"/>
        <path d="M2 8H14V13H2V8Z" fill="#FFAA00"/>
        <path d="M5 4H11V8H5V4Z" fill="#FFFFFF"/>
        <path d="M6 5H8V7H6V5Z" fill="#FF2400"/>
        <path d="M9 6H10V7H9V6Z" fill="#FF2400"/>
      </svg>

      <!-- Pixel text as inline SVG -->
      <svg class="pixel-svg" viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpriteFetch logo text">
        <g transform="translate(8,8)">
          <!-- Pixel size = 6, spacing handled by coords -->
          <!-- S -->
          <g transform="translate(0,0)">
            <rect x="0" y="0" width="6" height="6" fill="#000"/>
            <rect x="6" y="0" width="6" height="6" fill="#000"/>
            <rect x="12" y="0" width="6" height="6" fill="#000"/>
            <rect x="18" y="0" width="6" height="6" fill="#000"/>
            <rect x="24" y="0" width="6" height="6" fill="#000"/>
            <rect x="0" y="6" width="6" height="6" fill="#000"/>
            <rect x="0" y="12" width="6" height="6" fill="#000"/>
            <rect x="0" y="18" width="6" height="6" fill="#000"/>
            <rect x="6" y="18" width="6" height="6" fill="#000"/>
            <rect x="12" y="18" width="6" height="6" fill="#000"/>
            <rect x="18" y="18" width="6" height="6" fill="#000"/>
            <rect x="24" y="18" width="6" height="6" fill="#000"/>
            <rect x="24" y="24" width="6" height="6" fill="#000"/>
            <rect x="24" y="30" width="6" height="6" fill="#000"/>
            <rect x="18" y="30" width="6" height="6" fill="#000"/>
          </g>
          <!-- P -->
          <g transform="translate(36,0)">
            <rect x="0" y="0" width="6" height="6" fill="#000"/>
            <rect x="6" y="0" width="6" height="6" fill="#000"/>
            <rect x="12" y="0" width="6" height="6" fill="#000"/>
            <rect x="18" y="0" width="6" height="6" fill="#000"/>
            <rect x="0" y="6" width="6" height="6" fill="#000"/>
            <rect x="0" y="12" width="6" height="6" fill="#000"/>
            <rect x="6" y="6" width="6" height="6" fill="#000"/>
            <rect x="12" y="6" width="6" height="6" fill="#000"/>
            <rect x="18" y="6" width="6" height="6" fill="#000"/>
            <rect x="0" y="18" width="6" height="6" fill="#000"/>
          </g>
          <!-- R -->
          <g transform="translate(72,0)">
            <rect x="0" y="0" width="6" height="6" fill="#000"/>
            <rect x="6" y="0" width="6" height="6" fill="#000"/>
            <rect x="12" y="0" width="6" height="6" fill="#000"/>
            <rect x="18" y="0" width="6" height="6" fill="#000"/>
            <rect x="0" y="6" width="6" height="6" fill="#000"/>
            <rect x="6" y="6" width="6" height="6" fill="#000"/>
            <rect x="12" y="6" width="6" height="6" fill="#000"/>
            <rect x="0" y="12" width="6" height="6" fill="#000"/>
            <rect x="6" y="12" width="6" height="6" fill="#000"/>
            <rect x="12" y="12" width="6" height="6" fill="#000"/>
            <rect x="18" y="12" width="6" height="6" fill="#000"/>
            <rect x="6" y="18" width="6" height="6" fill="#000"/>
            <rect x="12" y="24" width="6" height="6" fill="#000"/>
          </g>
          <!-- I -->
          <g transform="translate(108,0)">
            <rect x="6" y="0" width="6" height="6" fill="#000"/>
            <rect x="6" y="6" width="6" height="6" fill="#000"/>
            <rect x="6" y="12" width="6" height="6" fill="#000"/>
            <rect x="6" y="18" width="6" height="6" fill="#000"/>
            <rect x="6" y="24" width="6" height="6" fill="#000"/>
            <rect x="6" y="30" width="6" height="6" fill="#000"/>
          </g>
          <!-- T -->
          <g transform="translate(132,0)">
            <rect x="0" y="0" width="36" height="6" fill="#000"/>
            <rect x="12" y="6" width="6" height="30" fill="#000"/>
          </g>
          <!-- E -->
          <g transform="translate(174,0)">
            <rect x="0" y="0" width="30" height="6" fill="#000"/>
            <rect x="0" y="6" width="6" height="36" fill="#000"/>
            <rect x="0" y="18" width="24" height="6" fill="#000"/>
            <rect x="0" y="36" width="30" height="6" fill="#000"/>
          </g>
          <!-- F -->
          <g transform="translate(216,0)">
            <rect x="0" y="0" width="30" height="6" fill="#000"/>
            <rect x="0" y="6" width="6" height="36" fill="#000"/>
            <rect x="0" y="18" width="24" height="6" fill="#000"/>
          </g>
          <!-- E (repeat) -->
          <g transform="translate(258,0)">
            <rect x="0" y="0" width="30" height="6" fill="#000"/>
            <rect x="0" y="6" width="6" height="36" fill="#000"/>
            <rect x="0" y="18" width="24" height="6" fill="#000"/>
            <rect x="0" y="36" width="30" height="6" fill="#000"/>
          </g>
          <!-- T (repeat) -->
          <g transform="translate(300,0)">
            <rect x="0" y="0" width="36" height="6" fill="#000"/>
            <rect x="12" y="6" width="6" height="30" fill="#000"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
