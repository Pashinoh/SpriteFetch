name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release'
        required: true
        default: 'v0.1'

jobs:
  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      # opt into Node.js 24 for JavaScript actions to avoid Node.js 20 deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure release files exist
        run: |
          if [ ! -f "RELEASES/${{ github.event.inputs.tag }}.md" ]; then echo "Missing RELEASES/${{ github.event.inputs.tag }}.md"; exit 1; fi
          if [ ! -f "releases/SpriteFetch-${{ github.event.inputs.tag }}.zip" ]; then echo "Missing releases/SpriteFetch-${{ github.event.inputs.tag }}.zip"; exit 1; fi

      - name: Create GitHub release via REST API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          REPO="${{ github.repository }}"
          # prefer RELEASES/ for markdown body but accept lowercase too
          if [ -f "RELEASES/${TAG}.md" ]; then
            BODY_FILE="RELEASES/${TAG}.md"
          elif [ -f "releases/${TAG}.md" ]; then
            BODY_FILE="releases/${TAG}.md"
          else
            echo "Missing RELEASES/${TAG}.md or releases/${TAG}.md"; exit 1;
          fi
          # pick the existing ZIP asset (case-insensitive fallback)
          if [ -f "releases/SpriteFetch-${TAG}.zip" ]; then
            ASSET_PATH="releases/SpriteFetch-${TAG}.zip"
          elif [ -f "RELEASES/SpriteFetch-${TAG}.zip" ]; then
            ASSET_PATH="RELEASES/SpriteFetch-${TAG}.zip"
          else
            echo "Missing releases/ or RELEASES/ SpriteFetch-${TAG}.zip"; exit 1;
          fi
          BODY=$(jq -Rs . < "$BODY_FILE")
          DATA=$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg body "$BODY" '{ tag_name: $tag, name: $name, body: ($body|fromjson), draft: false, prerelease: false }')
          RESP=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/releases" -d "$DATA")
          UPLOAD_URL=$(echo "$RESP" | jq -r .upload_url | sed -e 's/{?name,label}//')
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then echo "Failed to create release: $RESP"; exit 1; fi
          ASSET_NAME=$(basename "$ASSET_PATH")
          echo "Uploading asset $ASSET_NAME to $UPLOAD_URL"
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/zip" --data-binary @"$ASSET_PATH" "${UPLOAD_URL}?name=${ASSET_NAME}" | jq .
